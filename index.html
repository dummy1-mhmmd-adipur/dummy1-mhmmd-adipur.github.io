<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mhmmd.adipur — Web Apps</title>
  <meta name="description" content="A collection of free browser-based web apps, save editors and developer tools by mhmmd.adipur. 100% local, no install.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#09090b; --panel:#141417; --panel-hover:#1c1c21;
      --text:#fafafa; --muted:#a1a1aa; --border:rgba(255,255,255,0.08); --border-hi:rgba(255,255,255,0.16);
      --accent:#6366f1; --accent2:#06b6d4; --green:#10b981; --gold:#f59e0b;
      --radius:18px; --radius-sm:10px;
      --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
      --mono:'JetBrains Mono',ui-monospace,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;}
    body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;}
    body::before{width:520px;height:520px;top:-160px;left:-120px;background:radial-gradient(circle,rgba(99,102,241,0.25),transparent 70%);animation:float1 14s ease-in-out infinite;}
    body::after{width:460px;height:460px;bottom:-160px;right:-120px;background:radial-gradient(circle,rgba(6,182,212,0.22),transparent 70%);animation:float2 16s ease-in-out infinite;}
    @keyframes float1{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,30px);}}
    @keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-40px,-30px);}}
    .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:60px 24px 80px;}

    /* Hero */
    .hero{text-align:center;margin-bottom:34px;}
    .avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;background:linear-gradient(145deg,var(--accent),var(--accent2));box-shadow:0 10px 30px rgba(99,102,241,0.4);}
    .hero h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-0.02em;background:linear-gradient(to right,#fff 20%,#a5b4fc 60%,#67e8f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    .hero .tag{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--accent2);background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.25);padding:6px 14px;border-radius:99px;}
    .hero p{color:var(--muted);font-size:15px;margin-top:16px;max-width:520px;margin:16px auto 0;}

    /* Controls (sticky) */
    .controls{position:sticky;top:0;z-index:20;padding:16px 0 14px;margin-bottom:22px;background:linear-gradient(to bottom,var(--bg) 70%,transparent);}
    .searchbar{position:relative;max-width:520px;margin:0 auto 14px;}
    .searchbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);}
    #search{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:99px;color:var(--text);font-family:var(--font);font-size:14px;padding:13px 44px 13px 44px;transition:border-color .15s,box-shadow .15s;}
    #search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,0.18);}
    #search::placeholder{color:var(--muted);}
    .clear-s{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:16px;display:none;}
    .filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
    .pill{font-size:13px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--border);padding:7px 15px;border-radius:99px;cursor:pointer;transition:all .15s;user-select:none;}
    .pill:hover{border-color:var(--border-hi);color:var(--text);}
    .pill.active{background:var(--accent);color:#fff;border-color:transparent;}
    .pill .n{font-family:var(--mono);font-size:11px;opacity:0.7;margin-left:5px;}

    /* Grid */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;}
    .card{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-decoration:none;color:var(--text);overflow:hidden;transition:transform .2s cubic-bezier(.4,0,.2,1),border-color .2s,box-shadow .2s,background .2s,opacity .2s;}
    .card::after{content:"";position:absolute;inset:0;border-radius:var(--radius);background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(99,102,241,0.12),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none;}
    .card:hover{transform:translateY(-5px);border-color:var(--border-hi);background:var(--panel-hover);box-shadow:0 16px 40px rgba(0,0,0,0.45);}
    .card:hover::after{opacity:1;}
    .card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .card .ico{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,0.35);}
    .card .arrow{color:var(--muted);font-size:18px;transition:transform .2s,color .2s;}
    .card:hover .arrow{transform:translate(3px,-3px);color:var(--text);}
    .card h3{font-size:17px;font-weight:700;margin-bottom:6px;}
    .card .desc{font-size:13px;color:var(--muted);flex:1;}
    .card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
    .card .chip{font-size:11px;font-weight:600;color:var(--muted);background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:4px 9px;border-radius:7px;}
    .card .chip.live{color:var(--green);background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.25);}
    .card.hide{display:none;}

    /* mark search match */
    mark{background:rgba(245,158,11,0.3);color:#fde68a;border-radius:3px;padding:0 1px;}

    .empty{display:none;text-align:center;padding:60px 20px;color:var(--muted);}
    .empty .em{font-size:40px;margin-bottom:12px;}
    .empty.show{display:block;}

    footer{text-align:center;margin-top:56px;color:var(--muted);font-size:13px;}
    footer a{color:var(--accent2);text-decoration:none;}
    footer a:hover{text-decoration:underline;}

    @media (max-width:600px){ .wrap{padding:40px 16px 56px;} .hero{margin-bottom:24px;} }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="avatar">M</div>
      <h1>mhmmd.adipur</h1>
      <div class="tag">// web apps &amp; tools</div>
      <p>Free, browser-based tools, save editors and developer utilities. No install, 100% local.</p>
    </header>

    <div class="controls">
      <div class="searchbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="Search apps…" autocomplete="off">
        <span class="clear-s" id="clear-s" title="Clear">✕</span>
      </div>
      <div class="filters" id="filters"></div>
    </div>

    <div class="grid" id="apps"></div>

    <div class="empty" id="empty">
      <div class="em">🔍</div>
      <div>No apps match your search.</div>
    </div>

    <footer>Built by <a href="https://github.com/MhmmdAdipur" target="_blank" rel="noopener">mhmmd.adipur</a> · more tools coming soon</footer>
  </div>

  <script>
  // ---- App data (single source of truth) ----
  var APPS=[
    {name:"TCG Save Editor",href:"tcg-save-editor/",ico:"T",grad:"145deg,#6366f1,#06b6d4",cat:"save",
     desc:"Edit your TCG Card Shop Simulator save: coins, cards, workers, reviews, bills, stats and furniture. Exports a valid GameData file ready for JKSV.",
     tags:["PC & Switch","Vanilla JS"]},
    {name:"Universal Save Editor",href:"universal-save-editor/",ico:"U",grad:"145deg,#10b981,#06b6d4",cat:"save",
     desc:"Load any JSON, gzip, Base64, XML or plain-text save file, edit it in a visual tree, and export back to the original format.",
     tags:["Multi-format","Privacy-first"]},
    {name:"JSON Formatter",href:"json-formatter/",ico:"{ }",grad:"145deg,#a855f7,#6366f1",cat:"dev",
     desc:"Beautify, minify and validate JSON, with an interactive collapsible tree view and search.",
     tags:["Dev tool"]},
    {name:"Base64 · Hex · gzip",href:"encoder/",ico:"⇄",grad:"145deg,#06b6d4,#3b82f6",cat:"dev",
     desc:"Encode/decode Base64, Hex, URL and gzip (as Base64) — with one-click swap and copy.",
     tags:["Converter"]},
    {name:"QR Code Generator",href:"qr-generator/",ico:"▦",grad:"145deg,#f59e0b,#d97706",cat:"dev",
     desc:"Turn text or a URL into a QR code with custom colors, and download it as PNG or SVG.",
     tags:["PNG / SVG"]},
    {name:"Color Picker & Palette",href:"color-palette/",ico:"◑",grad:"145deg,#ec4899,#f59e0b",cat:"design",
     desc:"Pick a color, copy HEX/RGB/HSL, and generate shades, tints and harmonies.",
     tags:["Design"]},
    {name:"Universal Link Tester",href:"link-tester/",ico:"🔗",grad:"145deg,#6366f1,#8b5cf6",cat:"mobile",
     desc:"Fetch and validate a domain's apple-app-site-association and assetlinks.json.",
     tags:["Mobile dev"]},
    {name:"Icon & Splash Preview",href:"icon-preview/",ico:"🖼",grad:"145deg,#10b981,#22c55e",cat:"mobile",
     desc:"Upload a logo and preview it as app icons (various shapes/sizes) and a phone splash screen.",
     tags:["Mobile dev"]}
  ];
  var CATS=[
    {id:"all",label:"All"},
    {id:"save",label:"Save Editors"},
    {id:"dev",label:"Dev Tools"},
    {id:"design",label:"Design"},
    {id:"mobile",label:"Mobile Dev"}
  ];
  var curCat="all", curSearch="";

  var appsEl=document.getElementById('apps');
  var filtersEl=document.getElementById('filters');
  var emptyEl=document.getElementById('empty');
  var searchEl=document.getElementById('search');
  var clearEl=document.getElementById('clear-s');

  function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function highlight(text,q){ if(!q) return esc(text); var i=text.toLowerCase().indexOf(q); if(i<0) return esc(text); return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length)); }

  function renderCards(){
    appsEl.innerHTML='';
    var q=curSearch.toLowerCase().trim();
    var shown=0;
    APPS.forEach(function(a){
      var inCat = curCat==='all' || a.cat===curCat;
      var hay=(a.name+' '+a.desc+' '+a.tags.join(' ')).toLowerCase();
      var inSearch = !q || hay.indexOf(q)!==-1;
      if(!(inCat&&inSearch)) return;
      shown++;
      var card=document.createElement('a');
      card.className='card';card.href=a.href;card.setAttribute('data-card','');
      card.innerHTML=
        '<div class="top"><div class="ico" style="background:linear-gradient('+a.grad+')">'+esc(a.ico)+'</div><span class="arrow">↗</span></div>'+
        '<h3>'+highlight(a.name,q)+'</h3>'+
        '<p class="desc">'+highlight(a.desc,q)+'</p>'+
        '<div class="tags"><span class="chip live">● Live</span>'+a.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('')+'</div>';
      card.addEventListener('mousemove',function(e){var r=card.getBoundingClientRect();card.style.setProperty('--mx',(e.clientX-r.left)+'px');card.style.setProperty('--my',(e.clientY-r.top)+'px');});
      appsEl.appendChild(card);
    });
    emptyEl.classList.toggle('show', shown===0);
  }
  function renderFilters(){
    filtersEl.innerHTML='';
    CATS.forEach(function(c){
      var n = c.id==='all'? APPS.length : APPS.filter(function(a){return a.cat===c.id;}).length;
      var p=document.createElement('div');
      p.className='pill'+(c.id===curCat?' active':'');
      p.innerHTML=c.label+'<span class="n">'+n+'</span>';
      p.onclick=function(){ curCat=c.id; renderFilters(); renderCards(); };
      filtersEl.appendChild(p);
    });
  }
  searchEl.addEventListener('input',function(){ curSearch=this.value; clearEl.style.display=this.value?'block':'none'; renderCards(); });
  clearEl.addEventListener('click',function(){ searchEl.value=''; curSearch=''; clearEl.style.display='none'; renderCards(); searchEl.focus(); });
  // keyboard: "/" focuses search
  document.addEventListener('keydown',function(e){ if(e.key==='/'&&document.activeElement!==searchEl){ e.preventDefault(); searchEl.focus(); } });

  renderFilters();
  renderCards();
  </script>
</body>
</html>
