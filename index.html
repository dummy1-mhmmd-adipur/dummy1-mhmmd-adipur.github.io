<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mhmmd.adipur — Apps & Links</title>
  <style>
    :root{
      --bg:#09090b; --panel:#18181b; --panel2:#27272a;
      --text:#fafafa; --muted:#a1a1aa; --border:rgba(255,255,255,0.08);
      --accent:#6366f1; --cyan:#06b6d4;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(99,102,241,0.12), transparent 40%),
        radial-gradient(circle at 85% 100%, rgba(6,182,212,0.12), transparent 40%);
      background-attachment:fixed;
      color:var(--text); font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
      min-height:100vh; line-height:1.5; padding:40px 20px;
    }
    .wrap{max-width:860px;margin:0 auto;}
    header{text-align:center;margin-bottom:40px;}
    header h1{font-size:28px;font-weight:800;background:linear-gradient(to right,#fff,#a1a1aa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    header p{color:var(--muted);font-size:15px;margin-top:8px;}
    h2{font-size:14px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:32px 0 14px;font-weight:700;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
    .card{
      display:block;background:var(--panel);border:1px solid var(--border);
      border-radius:14px;padding:18px;text-decoration:none;color:var(--text);
      transition:transform .15s, border-color .15s, box-shadow .15s;
    }
    .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,0.3);}
    .card .ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin-bottom:12px;}
    .card h3{font-size:16px;font-weight:700;margin-bottom:4px;}
    .card p{font-size:13px;color:var(--muted);}
    footer{text-align:center;margin-top:48px;color:var(--muted);font-size:12px;}
    @media (max-width:600px){ body{padding:24px 14px;} header h1{font-size:22px;} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>mhmmd.adipur</h1>
      <p>Web apps &amp; mobile app links</p>
    </header>

    <h2>Web Apps</h2>
    <div class="grid">
      <a class="card" href="tcg-save-editor/">
        <div class="ico" style="background:linear-gradient(145deg,#6366f1,#06b6d4);">T</div>
        <h3>TCG Save Editor</h3>
        <p>Save editor for TCG Card Shop Simulator (PC &amp; Switch).</p>
      </a>
    </div>
  </div>
</body>
</html>
