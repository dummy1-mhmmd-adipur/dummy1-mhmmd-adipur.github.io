<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Icon &amp; Splash Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--panel:#141417;--input:#000;--text:#fafafa;--muted:#a1a1aa;--border:rgba(255,255,255,0.08);--border-hi:rgba(255,255,255,0.16);--accent:#6366f1;--accent2:#06b6d4;--green:#10b981;--radius:16px;--radius-sm:8px;--font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 15% 0%,rgba(99,102,241,0.1),transparent 40%),radial-gradient(circle at 85% 100%,rgba(6,182,212,0.1),transparent 40%);background-attachment:fixed;}
a{color:var(--accent2);text-decoration:none;}
#header{display:flex;align-items:center;gap:14px;padding:16px 28px;background:rgba(9,9,11,0.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-wrap:wrap;}
#header h1{font-size:17px;font-weight:800;flex:1;background:linear-gradient(to right,#fff,#a5b4fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
#header .home{font-size:13px;color:var(--muted);font-weight:600;}
.content{max-width:1000px;margin:0 auto;padding:28px 24px 70px;}
#drop{border:2px dashed var(--border-hi);border-radius:var(--radius);padding:40px 20px;text-align:center;background:rgba(255,255,255,0.02);cursor:pointer;transition:all .2s;margin-bottom:24px;}
#drop.hover{border-color:var(--accent);background:rgba(99,102,241,0.08);}
#drop .big{font-size:36px;margin-bottom:10px;}
#drop h2{font-size:18px;font-weight:800;margin-bottom:6px;}
#drop p{color:var(--muted);font-size:13px;}
.ctrl{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:22px;}
.ctrl label{font-size:12px;color:var(--muted);font-weight:600;}
input[type=color]{height:34px;width:52px;border:1px solid var(--border);border-radius:6px;background:var(--input);cursor:pointer;padding:3px;}
input[type=range]{vertical-align:middle;}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:22px 0 14px;}
.grid{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;}
.item{text-align:center;}
.item .cap{font-size:11px;color:var(--muted);margin-top:8px;font-family:var(--mono);}
.icon{background-size:cover;background-position:center;border:1px solid var(--border);}
.circle{border-radius:50%;}
.squircle{border-radius:22%;}
.rounded{border-radius:14%;}
.phone{width:200px;height:400px;border-radius:30px;border:6px solid #2a2a30;background:#000;position:relative;overflow:hidden;}
.phone .splash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.phone .splash .logo{width:84px;height:84px;background-size:contain;background-repeat:no-repeat;background-position:center;}
.muted{color:var(--muted);}
@media(max-width:600px){#header{padding:12px 16px;}.content{padding:18px 14px 50px;}.phone{width:160px;height:320px;}}
</style>
</head>
<body>
<div id="header">
  <h1>App Icon &amp; Splash Preview</h1>
  <a class="home" href="../">← All apps</a>
</div>
<div class="content">
  <div id="drop">
    <div class="big"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>
    <h2>Drop an icon/logo image</h2>
    <p>PNG with transparency works best. Processed locally — nothing uploaded.</p>
    <input type="file" id="file" accept="image/*" style="display:none">
  </div>

  <div id="area" style="display:none;">
    <div class="ctrl">
      <span><label>Splash background</label> <input type="color" id="bg" value="#111827" oninput="renderSplash()"></span>
      <span><label>Logo size</label> <input type="range" id="logo" min="40" max="140" value="84" oninput="renderSplash()"></span>
      <button class="home" style="cursor:pointer;background:none;border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;" onclick="document.getElementById('file').click()">Change image</button>
    </div>

    <h3>App icons (shapes)</h3>
    <div class="grid">
      <div class="item"><div class="icon rounded" id="i1" style="width:120px;height:120px;"></div><div class="cap">iOS 120px</div></div>
      <div class="item"><div class="icon squircle" id="i2" style="width:96px;height:96px;"></div><div class="cap">Android 96px</div></div>
      <div class="item"><div class="icon circle" id="i3" style="width:72px;height:72px;"></div><div class="cap">Circle 72px</div></div>
      <div class="item"><div class="icon rounded" id="i4" style="width:48px;height:48px;"></div><div class="cap">48px</div></div>
      <div class="item"><div class="icon rounded" id="i5" style="width:32px;height:32px;"></div><div class="cap">Favicon 32px</div></div>
    </div>

    <h3>Splash screen</h3>
    <div class="grid">
      <div class="item">
        <div class="phone"><div class="splash" id="splash"><div class="logo" id="splashLogo"></div></div></div>
        <div class="cap">Phone splash</div>
      </div>
    </div>
  </div>
</div>
<script>
var dataUrl=null;
var fi=document.getElementById('file'),drop=document.getElementById('drop');
drop.addEventListener('click',function(){fi.click();});
fi.addEventListener('change',function(e){if(e.target.files[0])load(e.target.files[0]);});
document.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('hover');});
document.addEventListener('dragleave',function(e){if(!e.relatedTarget)drop.classList.remove('hover');});
document.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('hover');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0]);});
function load(file){
  if(!/^image\//.test(file.type)){alert('Please choose an image file.');return;}
  var r=new FileReader();
  r.onload=function(ev){ dataUrl=ev.target.result; document.getElementById('area').style.display='block'; drop.style.display='none'; renderAll(); };
  r.readAsDataURL(file);
}
function renderAll(){
  ['i1','i2','i3','i4','i5'].forEach(function(id){ document.getElementById(id).style.backgroundImage='url('+dataUrl+')'; });
  renderSplash();
}
function renderSplash(){
  if(!dataUrl)return;
  document.getElementById('splash').style.background=document.getElementById('bg').value;
  var lg=document.getElementById('splashLogo');
  var s=document.getElementById('logo').value;
  lg.style.backgroundImage='url('+dataUrl+')';
  lg.style.width=s+'px';lg.style.height=s+'px';
}
</script>
</body>
</html>
