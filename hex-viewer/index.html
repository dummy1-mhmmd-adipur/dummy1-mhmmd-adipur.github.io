<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hex Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--panel:#141417;--input:#000;--text:#fafafa;--muted:#a1a1aa;--border:rgba(255,255,255,0.08);--border-hi:rgba(255,255,255,0.16);--accent:#6366f1;--accent2:#06b6d4;--green:#10b981;--red:#ef4444;--radius:16px;--radius-sm:8px;--font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 15% 0%,rgba(99,102,241,0.1),transparent 40%),radial-gradient(circle at 85% 100%,rgba(6,182,212,0.1),transparent 40%);background-attachment:fixed;}
a{color:var(--accent2);text-decoration:none;}
#header{display:flex;align-items:center;gap:14px;padding:16px 28px;background:rgba(9,9,11,0.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-wrap:wrap;}
#header h1{font-size:17px;font-weight:800;flex:1;background:linear-gradient(to right,#fff,#a5b4fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
#header .home{font-size:13px;color:var(--muted);font-weight:600;}
.btn{font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);transition:all .15s;}
.btn:hover{background:rgba(255,255,255,0.08);border-color:var(--border-hi);transform:translateY(-1px);}
.btn-p{background:linear-gradient(135deg,var(--accent),#4f46e5);border:none;color:#fff;}
.btn-g{background:linear-gradient(135deg,var(--green),#059669);border:none;color:#fff;}
.content{max-width:1200px;margin:0 auto;padding:22px 24px 70px;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
label.l{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:12px 0 6px;}
label.l:first-child{margin-top:0;}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--mono);font-size:12.5px;outline:none;}
textarea{min-height:140px;resize:vertical;line-height:1.55;}
textarea:focus,input:focus,select:focus{border-color:var(--accent);}
pre.out{background:var(--input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:50vh;}
.muted{color:var(--muted);}.err{color:#fca5a5;}.ok{color:#86efac;}
.stat{font-size:12px;color:var(--muted);font-family:var(--mono);}
@media(max-width:800px){.grid2{grid-template-columns:1fr;}#header{padding:12px 16px;flex-wrap:wrap;}.content{padding:16px 14px 50px;}}
.hx{line-height:1.6;font-size:12px;overflow-x:auto;white-space:pre;word-break:normal;}
.hx .of{color:var(--accent2);}
.hx mark{background:#f59e0b;color:#000;border-radius:2px;}
</style>
</head>
<body>
<div id="header">
  <h1>Hex Viewer</h1>
  <a class="home" href="../">← All apps</a>
</div>
<div class="content">
<div class="panel">
  <div class="toolbar" style="margin:0">
    <label class="btn btn-p" style="cursor:pointer">Open file<input type="file" id="f" style="display:none" onchange="load(this.files[0])"></label>
    <span class="stat" id="info">No file loaded. Files are read locally and never uploaded.</span>
  </div>
</div>
<div class="panel">
  <div class="toolbar" style="margin:0 0 12px">
    <input type="text" id="goto" placeholder="Go to offset (e.g. 0x1F0 or 496)" style="width:230px" onkeydown="if(event.key==='Enter')go()">
    <button class="btn" onclick="go()">Go</button>
    <input type="text" id="find" placeholder="Find (text or hex: 1f 8b)" style="width:230px" onkeydown="if(event.key==='Enter')find(1)">
    <select id="mode" style="width:auto"><option value="text">Text</option><option value="hex">Hex</option></select>
    <button class="btn" onclick="find(1)">Next</button>
    <span class="stat" id="fs"></span>
  </div>
  <div class="toolbar" style="margin:0 0 12px">
    <button class="btn" onclick="page(-1)">← Prev</button>
    <button class="btn" onclick="page(1)">Next →</button>
    <span class="stat" id="pg"></span>
  </div>
  <pre class="out hx" id="hx" style="max-height:none"><span class="muted">Open a file to see its bytes.</span></pre>
</div>
</div>
<script>
var buf=null,off=0,PAGE=4096,hit=-1,hitLen=0;
function hex2(n){return (n<16?'0':'')+n.toString(16);}
function load(file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(){buf=new Uint8Array(r.result);off=0;hit=-1;
    var magic='';
    if(buf[0]===0x1f&&buf[1]===0x8b)magic=' · gzip';
    else if(buf[0]===0x50&&buf[1]===0x4b)magic=' · zip';
    else if(buf[0]===0x89&&buf[1]===0x50)magic=' · png';
    else if(buf[0]===0x7b||buf[0]===0x5b)magic=' · looks like JSON/text';
    document.getElementById('info').textContent=file.name+' · '+buf.length.toLocaleString()+' bytes'+magic;
    render();};
  r.readAsArrayBuffer(file);
}
function render(){
  var host=document.getElementById('hx');
  if(!buf){return;}
  var end=Math.min(buf.length,off+PAGE),html='';
  for(var a=off;a<end;a+=16){
    var h='',t='';
    for(var i=0;i<16;i++){
      var p=a+i;
      if(p<buf.length){var b=buf[p],on=hit>=0&&p>=hit&&p<hit+hitLen;
        var hs=hex2(b),ts=(b>=32&&b<127)?String.fromCharCode(b).replace('&','&amp;').replace('<','&lt;'):'.';
        h+=on?'<mark>'+hs+'</mark> ':hs+' ';t+=on?'<mark>'+ts+'</mark>':ts;}
      else h+='   ';
      if(i===7)h+=' ';
    }
    html+='<span class="of">'+a.toString(16).padStart(8,'0')+'</span>  '+h+' |'+t+'|\n';
  }
  host.innerHTML=html||'<span class="muted">Empty file.</span>';
  document.getElementById('pg').textContent='Offset 0x'+off.toString(16)+' – 0x'+Math.max(0,end-1).toString(16)+' of '+buf.length.toLocaleString();
}
function page(d){if(!buf)return;off=Math.max(0,Math.min(buf.length-1,off+d*PAGE));off-=off%16;render();}
function go(){
  if(!buf)return;var v=document.getElementById('goto').value.trim();if(!v)return;
  var n=/^0x/i.test(v)?parseInt(v,16):parseInt(v,10);
  if(isNaN(n)||n<0||n>=buf.length){document.getElementById('fs').textContent='Offset out of range';return;}
  off=n-n%16;hit=n;hitLen=1;document.getElementById('fs').textContent='';render();
}
function pattern(){
  var v=document.getElementById('find').value;if(!v)return null;
  if(document.getElementById('mode').value==='hex'){
    var c=v.replace(/0x/gi,'').replace(/[\s,]/g,'');
    if(!/^[0-9a-fA-F]+$/.test(c)||c.length%2){return 'bad';}
    var o=[];for(var i=0;i<c.length;i+=2)o.push(parseInt(c.substr(i,2),16));return o;
  }
  return Array.prototype.map.call(new TextEncoder().encode(v),function(x){return x;});
}
function find(){
  if(!buf)return;var p=pattern(),fs=document.getElementById('fs');
  if(!p)return;if(p==='bad'){fs.textContent='Invalid hex';return;}
  var start=hit>=0?hit+1:off,n=buf.length-p.length;
  for(var pass=0;pass<2;pass++){
    for(var i=pass?0:start;i<=n;i++){
      var ok=true;for(var j=0;j<p.length;j++){if(buf[i+j]!==p[j]){ok=false;break;}}
      if(ok){hit=i;hitLen=p.length;off=i-i%16;fs.textContent='Found at 0x'+i.toString(16);render();return;}
    }
  }
  fs.textContent='Not found';
}
</script>
</body>
</html>
